scenarios:
  - name: "School Student Leave Operating Unit - operating_unit_id is stored"
    steps:
      - step: "Setup - create partner for Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou_a_partner"
        values:
          name: "Student Leave Operating Unit A Partner"

      - step: "Setup - create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "Student Leave Operating Unit A"
          code: "OUSL01"
          company_id: "REF: base.main_company"
          partner_id: "EVAL: registry['ou_a_partner'].id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type OU Leave Test"
          code: "GTOUSL"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School OU Leave Test"
          code: "SCHOUSL"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year OU Leave Test"
          code: "AYOUSL"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Term OU Leave Test"
          code: "TMOUSL"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student OU Leave Test Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student OU Leave Test"
          code: "STUOUSL"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create student leave with explicit operating unit"
        action: "create"
        model: "school_student_leave"
        save_as: "leave"
        values:
          date: "2024-08-01"
          student_id: "EVAL: registry['student'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          operating_unit_id: "EVAL: registry['ou_a'].id"

      - step: "Assert leave created"
        action: "assert"
        target: "leave"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"

      - step: "Verify via search that operating_unit_id persisted"
        action: "search"
        model: "school_student_leave"
        domain:
          - ["id", "=", "EVAL: registry['leave'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['ou_a'].id"]
        save_as: "check_leave_ou"
        expect_count: 1
